name: Autograding Tests
'on':
  repository_dispatch:
  schedule:
  - cron: '0 8 * * *'
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: assignment 1 test
      id: assignment-1-test
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: assignment 1 test
        setup-command: ''
        command: make grade
        timeout: 3
        max-score: 100
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        ASSIGNMENT-1-TEST_RESULTS: "${{steps.assignment-1-test.outputs.result}}"
      with:
        runners: assignment-1-test
